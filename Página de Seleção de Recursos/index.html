<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seleção de recursos</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <main class="selection-page">
      <header class="page-heading">
        <p class="eyebrow">FAÇA A SUA ESCOLHA</p>
        <h1>Seleção de recursos</h1>
        <p class="intro">Escolha as ferramentas que deseja no seu espaço de trabalho. 
          Você pode alterá-las quando quiser.</p>
      </header>

      <div class="feature-card-container">
        <label class="feature-card">
          <span class="feature-icon" aria-hidden="true">✦</span>
          <span class="feature-copy">
            <span class="feature-name">Análises inteligentes</span>
            <span class="feature-description">Transforme sua atividade em informações claras e úteis.</span>
          </span>
          <input type="checkbox" name="features" value="smart-insights" aria-label="Análises inteligentes">
        </label>

        <label class="feature-card">
          <span class="feature-icon" aria-hidden="true">◷</span>
          <span class="feature-copy">
            <span class="feature-name">Modo de foco</span>
            <span class="feature-description">Afaste as distrações enquanto trabalha.</span>
          </span>
          <input type="checkbox" name="features" value="focus-mode" aria-label="Modo de foco">
        </label>

        <label class="feature-card">
          <span class="feature-icon" aria-hidden="true">↗</span>
          <span class="feature-copy">
            <span class="feature-name">Resumo semanal</span>
            <span class="feature-description">Receba um resumo da sua semana.</span>
          </span>
          <input type="checkbox" name="features" value="weekly-digest" aria-label="Resumo semanal">
        </label>

        <label class="feature-card">
          <span class="feature-icon" aria-hidden="true">⌘</span>
          <span class="feature-copy">
            <span class="feature-name">Atalhos rápidos</span>
            <span class="feature-description">Acesse suas ações favoritas com menos etapas.</span>
          </span>
          <input type="checkbox" name="features" value="quick-shortcuts" aria-label="Atalhos rápidos">
        </label>
      </div>
    </main>
  </body>
</html>
